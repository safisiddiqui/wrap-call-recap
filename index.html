<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wrap — call notes to two recaps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --canvas:#F2F1F7;
    --surface:#FFFFFF;
    --brand:#4B3B8F;
    --brand-deep:#332764;
    --brand-tint:#EEEBFA;
    --ink:#1B1826;
    --ink2:#5F5973;
    --ink3:#918BA3;
    --line:#E6E3EE;
    --field:#F6F5FA;

    --hold:#A2620F;
    --hold-tint:#FCF3E2;
    --hold-line:#EBD9B4;

    --send:#4B3B8F;
    --send-tint:#EFECFB;
    --send-line:#D8D2F2;

    --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
    --lift:0 1px 2px rgba(27,24,38,.04), 0 12px 32px -8px rgba(27,24,38,.10);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--canvas);
    color:var(--ink);
    font-family:var(--font);
    font-size:14px;line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  :focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}

  /* ============ header ============ */
  header{padding:20px 24px 0}
  .bar{
    max-width:1340px;margin:0 auto;
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  }
  .glyph{
    width:32px;height:32px;border-radius:9px;flex:none;
    background:linear-gradient(145deg,var(--brand) 0%,var(--brand-deep) 100%);
    color:#fff;font-weight:700;font-size:15px;
    display:flex;align-items:center;justify-content:center;
    letter-spacing:-.02em;
  }
  .name{font-size:17px;font-weight:700;letter-spacing:-.02em}
  .strap{font-size:13.5px;color:var(--ink2)}
  .by{margin-left:auto;font-size:12.5px;color:var(--ink3);font-weight:500}
  @media(max-width:600px){ .strap{width:100%;order:5} }

  /* ============ shell ============ */
  .shell{
    max-width:1340px;margin:0 auto;padding:18px 24px 48px;
    display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:20px;
    align-items:start;
  }
  @media(max-width:960px){ .shell{grid-template-columns:1fr;padding:16px} }

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:16px;
    box-shadow:var(--lift);
  }

  /* ============ left ============ */
  .notes{padding:22px}
  .notes h2{margin:0;font-size:16px;font-weight:700;letter-spacing:-.015em}
  .notes .hint{margin:3px 0 16px;font-size:13px;color:var(--ink2)}

  .seeds{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:22px}
  .seed{
    font:inherit;font-size:12.5px;font-weight:500;cursor:pointer;
    background:var(--field);color:var(--ink2);
    border:1px solid transparent;border-radius:999px;
    padding:6px 13px;transition:background .12s,color .12s;
  }
  .seed:hover{background:#EDEBF4;color:var(--ink)}
  .seed.on{background:var(--brand);color:#fff}

  .f{margin-bottom:16px}
  .f:last-child{margin-bottom:0}
  .f label{
    display:block;font-size:12.5px;font-weight:600;color:var(--ink);
    margin-bottom:6px;
  }
  .f label i{font-style:normal;font-weight:400;color:var(--ink3)}
  .pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:460px){ .pair{grid-template-columns:1fr} }

  input[type=text],textarea{
    width:100%;font-family:var(--font);font-size:13.5px;line-height:1.5;
    color:var(--ink);background:var(--field);
    border:1px solid transparent;border-radius:9px;
    padding:9px 12px;resize:vertical;transition:background .12s,border-color .12s;
  }
  input[type=text]::placeholder,textarea::placeholder{color:#A9A3B8}
  input[type=text]:focus,textarea:focus{
    outline:none;background:#fff;border-color:var(--brand);
    box-shadow:0 0 0 3px rgba(75,59,143,.11);
  }
  textarea{min-height:66px}
  textarea.tall{min-height:86px}

  /* ============ right ============ */
  .out{overflow:hidden;position:relative}

  .toolbar{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    padding:14px 18px;border-bottom:1px solid var(--line);
  }
  .seg{
    display:inline-flex;background:var(--field);
    border-radius:11px;padding:3px;gap:2px;
  }
  .seg button{
    font:inherit;font-size:13px;font-weight:600;cursor:pointer;
    background:transparent;color:var(--ink2);
    border:none;border-radius:8px;padding:7px 16px;
    transition:background .14s,color .14s,box-shadow .14s;
  }
  .seg button:hover{color:var(--ink)}
  .seg button.on{
    background:#fff;color:var(--ink);
    box-shadow:0 1px 2px rgba(27,24,38,.10);
  }
  .copy{
    margin-left:auto;font:inherit;font-size:13px;font-weight:600;cursor:pointer;
    background:var(--ink);color:#fff;border:none;border-radius:9px;
    padding:8px 16px;transition:background .12s;
  }
  .copy:hover{background:#000}

  .context{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:11px 18px;font-size:13px;font-weight:500;
    border-bottom:1px solid var(--line);
  }
  .context .dot{width:7px;height:7px;border-radius:50%;flex:none}
  .context .badge{
    margin-left:auto;font-size:12px;font-weight:600;
    border-radius:999px;padding:3px 10px;
  }
  .ctx-hold{background:var(--hold-tint);color:var(--hold)}
  .ctx-hold .dot{background:var(--hold)}
  .ctx-hold .badge{background:#fff;color:var(--hold);border:1px solid var(--hold-line)}
  .ctx-send{background:var(--send-tint);color:var(--send)}
  .ctx-send .dot{background:var(--send)}
  .ctx-send .badge{background:#fff;color:var(--send);border:1px solid var(--send-line)}

  .sheet{padding:30px 34px 40px;max-width:68ch}
  @media(max-width:960px){ .sheet{padding:24px 20px 32px} }

  .sheet .head{
    display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
    padding-bottom:16px;margin-bottom:22px;border-bottom:1px solid var(--line);
  }
  .sheet .head .big{font-size:19px;font-weight:700;letter-spacing:-.02em}
  .sheet .head .sm{font-size:13px;color:var(--ink2)}

  .sheet h3{
    font-size:12px;font-weight:700;color:var(--ink3);
    margin:26px 0 10px;letter-spacing:.02em;
  }
  .sheet h3:first-child{margin-top:0}
  .sheet p{margin:0 0 15px;font-size:15px;line-height:1.65}
  .sheet ul{margin:0 0 15px;padding-left:0;list-style:none}
  .sheet li{
    font-size:15px;line-height:1.6;margin-bottom:9px;
    padding-left:19px;position:relative;
  }
  .sheet li::before{
    content:"";position:absolute;left:3px;top:.62em;
    width:5px;height:5px;border-radius:50%;background:var(--ink3);
  }

  .flagged{
    background:var(--hold-tint);
    border:1px solid var(--hold-line);
    border-radius:12px;padding:16px 18px;margin:0 0 15px;
  }
  .flagged h3{margin-top:0;color:var(--hold)}
  .flagged ul{margin-bottom:0}
  .flagged li::before{background:var(--hold)}

  .step{
    display:grid;grid-template-columns:1fr auto;gap:16px;align-items:baseline;
    padding:11px 0;border-bottom:1px solid var(--line);
  }
  .step:last-child{border-bottom:none}
  .step .task{font-size:15px}
  .step .who{
    font-size:12.5px;font-weight:600;color:var(--ink2);
    background:var(--field);border-radius:999px;padding:3px 10px;white-space:nowrap;
  }
  .step .who.none{background:#FDECEA;color:#A8382C}

  .nothing{color:var(--ink3);font-size:14px;padding:6px 0}

  .foot{
    max-width:1340px;margin:0 auto;padding:0 24px 44px;
    font-size:12.5px;color:var(--ink3);
  }
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(10px);
    background:var(--ink);color:#fff;font-size:13px;font-weight:500;
    padding:10px 18px;border-radius:10px;
    box-shadow:0 8px 24px rgba(27,24,38,.22);
    opacity:0;pointer-events:none;transition:opacity .16s,transform .16s;z-index:50;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="glyph">W</div>
    <div class="name">Wrap</div>
    <div class="strap">One set of call notes. Two recaps.</div>
    <div class="by">Built by Safi Siddiqui</div>
  </div>
</header>

<div class="shell">

  <section class="card notes">
    <h2>Your notes</h2>
    <p class="hint">Type it the way you'd say it. One thought per line.</p>

    <div class="seeds" id="seeds"></div>

    <div class="f pair">
      <div>
        <label for="cust">Customer</label>
        <input type="text" id="cust" placeholder="Northwind Retail">
      </div>
      <div>
        <label for="date">Call date</label>
        <input type="text" id="date" placeholder="March 12">
      </div>
    </div>

    <div class="f pair">
      <div>
        <label for="who">Who was on it</label>
        <input type="text" id="who" placeholder="Dana Ruiz, Marcus Bell">
      </div>
      <div>
        <label for="me">You <i>signs the email</i></label>
        <input type="text" id="me" placeholder="Safi">
      </div>
    </div>

    <div class="f">
      <label for="covered">What you covered</label>
      <textarea id="covered" class="tall" placeholder="Walked through Q1 usage&#10;They asked about the reporting rollout"></textarea>
    </div>

    <div class="f">
      <label for="decided">What got decided</label>
      <textarea id="decided" placeholder="Rollout moves to April&#10;They pilot with two teams first"></textarea>
    </div>

    <div class="f">
      <label for="risks">What's worrying you <i>stays internal</i></label>
      <textarea id="risks" placeholder="Their champion is changing roles in May"></textarea>
    </div>

    <div class="f">
      <label for="steps">Next steps <i>task, owner, date</i></label>
      <textarea id="steps" class="tall" placeholder="Send the timeline, Safi, Friday&#10;Confirm the pilot teams, Dana, next week"></textarea>
    </div>
  </section>

  <section class="card out">
    <div class="toolbar">
      <div class="seg">
        <button class="on" data-view="note">Internal note</button>
        <button data-view="mail">Email to customer</button>
      </div>
      <button class="copy" id="copy">Copy</button>
    </div>
    <div class="context" id="context"></div>
    <div class="sheet" id="sheet"></div>
  </section>

</div>

<p class="foot">Nothing you type leaves your browser. No account, no server, nothing stored.</p>
<div class="toast" id="toast">Copied</div>

<script>
(function(){
  "use strict";

  var SEEDS={
    "Northwind Retail":{
      cust:"Northwind Retail",date:"March 12",who:"Dana Ruiz, Marcus Bell",me:"Safi",
      covered:"Walked through Q1 search performance together\nThey raised that the reporting dashboards still aren't used by the merch team\nTalked through what the April release changes for them",
      decided:"Reporting rollout moves to April so it lands after the spring campaign\nThey'll pilot with two regional merch teams before a full rollout\nWe run a 30 minute training instead of sending the written guide",
      risks:"Marcus is the only person who actually opens the dashboards\nSpring campaign could push this again if it slips",
      steps:"Send the April rollout timeline, Safi, Friday\nConfirm the two pilot teams, Dana, next week\nBook the training session, Safi, once teams are confirmed"
    },
    "Lumen Health":{
      cust:"Lumen Health",date:"March 14",who:"Priya Raman",me:"Safi",
      covered:"Reviewed patient messaging volume since the January launch\nPriya walked me through the intake workflow her team actually uses\nShe asked whether we can route by clinic instead of by region",
      decided:"We'll scope clinic level routing and come back with a timeline\nHolding the second location launch until routing is settled",
      risks:"The launch slipping puts the expansion conversation at risk\nPriya said her team is short staffed through April",
      steps:"Scope clinic level routing with product, Safi, end of month\nSend the revised launch sequence, Safi, Thursday\nShare intake volume by clinic, Priya, this week"
    },
    "Forge Fintech":{
      cust:"Forge Fintech",date:"March 18",who:"Andre Okafor, Lena Cho",me:"Safi",
      covered:"Went through the failed webhook incident from last week\nAndre wants clearer alerting before it reaches their customers\nLena asked about sandbox access for her new team",
      decided:"Proactive alerting goes on for their account this week\nSandbox access ships with the next provisioning batch",
      risks:"Second incident this quarter and Andre brought up the SLA\nTrust is thinner than the usage numbers suggest",
      steps:"Enable proactive alerting, Safi, this week\nSend the incident writeup, Safi, Wednesday\nProvision the sandbox, Safi, next batch"
    }
  };

  var FIELDS=["cust","date","who","me","covered","decided","risks","steps"];
  var view="note";
  function $(i){return document.getElementById(i);}
  function v(i){return $(i).value.trim();}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){
    return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c];});}
  function lines(s){return String(s||"").split("\n").map(function(x){
    return x.replace(/^[\s\-\u2022*]+/,"").trim();}).filter(Boolean);}
  function steps(s){return lines(s).map(function(l){
    var p=l.split(",").map(function(x){return x.trim();}).filter(Boolean);
    return {task:p[0]||"",who:p[1]||"",when:p[2]||""};}).filter(function(x){return x.task;});}
  function firsts(s){
    var r=String(s||"").split(/,| and /).map(function(x){return x.trim();}).filter(Boolean);
    var f=r.map(function(n){return n.split(/\s+/)[0];});
    if(!f.length)return "";
    if(f.length===1)return f[0];
    if(f.length===2)return f[0]+" and "+f[1];
    return f.slice(0,-1).join(", ")+" and "+f[f.length-1];
  }
  function ul(a){return "<ul>"+a.map(function(x){return "<li>"+esc(x)+"</li>";}).join("")+"</ul>";}
  function rows(l,fb){return l.map(function(s){
    var m=[s.who,s.when].filter(Boolean).join(" · ");
    return "<div class='step'><div class='task'>"+esc(s.task)+"</div>"
      +"<div class='who"+(m?"":" none")+"'>"+(m||fb)+"</div></div>";}).join("");}
  function blank(){return !v("cust")&&!v("covered")&&!v("decided")&&!v("risks")&&!v("steps");}

  function note(){
    if(blank())return "<p class='nothing'>Start typing on the left. This fills in as you go.</p>";
    var cov=lines(v("covered")),dec=lines(v("decided")),rk=lines(v("risks")),st=steps(v("steps"));
    var bits=[];
    if(v("date"))bits.push("Call on "+esc(v("date")));
    if(v("who"))bits.push("With "+esc(v("who")));
    var h="<div class='head'><div class='big'>"+esc(v("cust")||"Untitled account")+"</div>"
      +(bits.length?"<div class='sm'>"+bits.join(" · ")+"</div>":"")+"</div>";
    if(cov.length)h+="<h3>What we covered</h3>"+ul(cov);
    if(dec.length)h+="<h3>Decisions</h3>"+ul(dec);
    if(rk.length) h+="<div class='flagged'><h3>Watch</h3>"+ul(rk)+"</div>";
    if(st.length) h+="<h3>Next steps</h3>"+rows(st,"Unassigned");
    return h;
  }

  function mail(){
    if(blank())return "<p class='nothing'>Start typing on the left. This fills in as you go.</p>";
    var cov=lines(v("covered")),dec=lines(v("decided")),st=steps(v("steps"));
    var subj=v("cust")?("Recap and next steps: "+v("cust")):"Recap and next steps";
    var h="<div class='head'><div class='big'>"+esc(subj)+"</div><div class='sm'>Subject line</div></div>";
    h+="<p>Hi "+(firsts(v("who"))?esc(firsts(v("who"))):"there")+",</p>";
    h+="<p>Thanks for the time today. Writing down what we landed on so we're working from the same page.</p>";
    if(dec.length)h+="<h3>What we agreed</h3>"+ul(dec);
    else if(cov.length)h+="<h3>What we covered</h3>"+ul(cov);
    if(st.length)h+="<h3>Next steps</h3>"+rows(st,"To assign");
    h+="<p style='margin-top:22px'>If I've got any of that wrong, tell me and I'll fix it.</p>";
    h+="<p>Thanks,<br>"+esc(v("me")||"")+"</p>";
    return h;
  }

  function context(){
    var held=lines(v("risks")).length;
    var el=$("context");
    if(view==="note"){
      el.className="context ctx-hold";
      el.innerHTML="<span class='dot'></span><span>Only you and your team see this</span>"
        +(held?"<span class='badge'>"+held+" flagged</span>":"");
    }else{
      el.className="context ctx-send";
      el.innerHTML="<span class='dot'></span><span>This one goes to the customer</span>"
        +(held?"<span class='badge'>"+held+" note"+(held>1?"s":"")+" held back</span>":"");
    }
  }

  function paint(){ context(); $("sheet").innerHTML=(view==="note")?note():mail(); }

  function txtNote(){
    var o=[],cov=lines(v("covered")),dec=lines(v("decided")),rk=lines(v("risks")),st=steps(v("steps"));
    o.push((v("cust")||"Untitled account")+(v("date")?" — call on "+v("date"):""));
    if(v("who"))o.push("With: "+v("who"));
    o.push("");
    if(cov.length){o.push("What we covered");cov.forEach(function(x){o.push("- "+x);});o.push("");}
    if(dec.length){o.push("Decisions");dec.forEach(function(x){o.push("- "+x);});o.push("");}
    if(rk.length){o.push("Watch");rk.forEach(function(x){o.push("- "+x);});o.push("");}
    if(st.length){o.push("Next steps");st.forEach(function(s){
      var m=[s.who,s.when].filter(Boolean).join(" — ");o.push("- "+s.task+(m?"  ("+m+")":""));});}
    return o.join("\n").trim();
  }
  function txtMail(){
    var o=[],dec=lines(v("decided")),cov=lines(v("covered")),st=steps(v("steps"));
    o.push("Subject: "+(v("cust")?"Recap and next steps: "+v("cust"):"Recap and next steps"));
    o.push("");o.push("Hi "+(firsts(v("who"))||"there")+",");o.push("");
    o.push("Thanks for the time today. Writing down what we landed on so we're working from the same page.");
    o.push("");
    if(dec.length){o.push("What we agreed:");dec.forEach(function(x){o.push("- "+x);});o.push("");}
    else if(cov.length){o.push("What we covered:");cov.forEach(function(x){o.push("- "+x);});o.push("");}
    if(st.length){o.push("Next steps:");st.forEach(function(s){
      var m=[s.who,s.when].filter(Boolean).join(" — ");o.push("- "+s.task+(m?"  ("+m+")":""));});o.push("");}
    o.push("If I've got any of that wrong, tell me and I'll fix it.");
    o.push("");o.push("Thanks,");o.push(v("me")||"");
    return o.join("\n").trim();
  }

  FIELDS.forEach(function(id){
    $(id).addEventListener("input",function(){
      var on=document.querySelector(".seed.on");
      if(on)on.classList.remove("on");
      paint();
    });
  });

  Array.prototype.forEach.call(document.querySelectorAll(".seg button"),function(b){
    b.addEventListener("click",function(){
      Array.prototype.forEach.call(document.querySelectorAll(".seg button"),function(x){x.classList.remove("on");});
      b.classList.add("on");
      view=b.getAttribute("data-view");
      paint();
    });
  });

  function load(n){
    var d=SEEDS[n]; if(!d)return;
    FIELDS.forEach(function(id){$(id).value=d[id]||"";});
    paint();
  }

  var box=$("seeds");
  Object.keys(SEEDS).forEach(function(n){
    var b=document.createElement("button");
    b.className="seed";b.type="button";b.textContent=n;
    b.addEventListener("click",function(){
      Array.prototype.forEach.call(document.querySelectorAll(".seed"),function(x){x.classList.remove("on");});
      b.classList.add("on");load(n);
    });
    box.appendChild(b);
  });

  $("copy").addEventListener("click",function(){
    var t=(view==="note")?txtNote():txtMail();
    var done=function(){
      var el=$("toast");
      el.textContent=(view==="note")?"Internal note copied":"Email copied";
      el.classList.add("show");
      setTimeout(function(){el.classList.remove("show");},1500);
    };
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(done,function(){fb(t,done);});
    }else{fb(t,done);}
  });
  function fb(t,cb){
    var a=document.createElement("textarea");
    a.value=t;a.style.position="fixed";a.style.opacity="0";
    document.body.appendChild(a);a.select();
    try{document.execCommand("copy");}catch(e){}
    document.body.removeChild(a);cb();
  }

  var f=document.querySelector(".seed");
  if(f)f.classList.add("on");
  load(Object.keys(SEEDS)[0]);
})();
</script>
</body>
</html>
